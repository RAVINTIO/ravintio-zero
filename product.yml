# product.yml: product-level version manifest.
#
# The top-level `id` gives the product a stable name for versioning and for
# attributing archived runs, wherever the repo is cloned (0000033 ADR-003).
#
# components[] holds {id, path} pointers to each component's own
# component.yml, not a cached version. Versions are read live at derivation
# time by `node ravintio-zero/scripts/product-version.mjs`, so this list
# only needs editing when a component is added or removed.

id: "ravintio-zero"
name: "RAVINTIO Zero"
version: "0.41.2"
feature: "0000315-isolated-test-state"

versionPolicy: "max-component-version"

components:
  - id: "ravintio-zero"
    path: "ravintio-zero/component.yml"
