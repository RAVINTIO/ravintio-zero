name: RAVINTIO Strict Pipeline

on:
  pull_request:
    branches: [ main, master, 'initiative/**' ]
  push:
    branches: [ main, master, 'initiative/**' ]

# Every job reads the repo and nothing more (0000036 S-006).
permissions:
  contents: read

jobs:
  validate-branch:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Code/Doc Parity
        run: |
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          # Standard check. This is a presence check, not a correspondence
          # guarantee: it confirms a file under plan/, docs/, or a
          # component.yml also changed in this diff — it does not verify
          # that file's content actually corresponds to the src/ change.
          if echo "$CHANGED_FILES" | grep -q "^src/"; then
            if ! echo "$CHANGED_FILES" | grep -qE "^(plan/|docs/|.*component\.yml)"; then
              echo "::error title=RAVINTIO Strict Violation::Code under src/ changed with no plan/, docs/, or component.yml file also touched in this diff. This checks presence only — it does not verify that content corresponds to your change."
              exit 1
            fi
          fi
          echo "✅ RAVINTIO pipeline passed."

      - name: Check PR description for attribution
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"
          node ravintio-zero/scripts/check-attribution.mjs "$RUNNER_TEMP/pr-body.txt"

      - name: Check the backlog index
        run: node ravintio-zero/scripts/backlog-index.mjs --check

      - name: Fail on a committed ignored file
        run: |
          IGNORED=$(git ls-files -ci --exclude-standard)
          if [ -n "$IGNORED" ]; then
            echo "::error title=RAVINTIO Strict Violation::A committed file matches an ignore rule. Remove it from the index, or add a negation rule to .gitignore if it must be tracked."
            echo "$IGNORED"
            exit 1
          fi

  # This job is specific to this repository's own self-description and is
  # deliberately NOT mirrored into ravintio-zero/hooks/ravintio.yml
  # (the copy setup.sh ships to consumer repos) — a consuming repo's README
  # doesn't have this repository's "## Repository structure" / "## The
  # pack" sections to validate against. See ADR-001 (feature 0000019).
  self-description-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify README matches repository structure
        run: node ravintio-zero/scripts/self-description-check.mjs .

  # The PowerShell suites, run under both Windows hosts (0000036 ADR-003).
  # run-tests.ps1 starts each suite with the host that runs it.
  windows-powershell:
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    permissions:
      contents: read
    # Both hosts run in parallel. fail-fast stays off so one failure does not
    # cancel the other, and the job passes only when both entries pass
    # (0000151 req-015).
    strategy:
      fail-fast: false
      matrix:
        include:
          - shell: powershell
          - shell: pwsh
    # A step's shell key takes no expression, so the matrix sets the job
    # default instead.
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      # Pinned to the v4 commit, with no token left in .git/config while the
      # PR's code runs (0000036 S-005).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: PowerShell suites on ${{ matrix.shell }}
        run: |
          & ./ravintio-zero/tests/run-tests.ps1
          exit $LASTEXITCODE

  # The Bash suites on Linux (0000037 ADR-002). run-tests.sh also runs the
  # .ps1 suites with pwsh, which ubuntu-latest ships. RAVINTIO_REQUIRE_PWSH
  # fails the run if pwsh is missing, so no suite skips unseen.
  bash-suites:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pinned to the v4 commit, with no token left in .git/config while the
      # PR's code runs (0000036 S-005).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Bash suites on Linux
        env:
          RAVINTIO_REQUIRE_PWSH: "1"
        run: bash ravintio-zero/tests/run-tests.sh

  # Fails a PR from initiative/* to main whose first-parent history holds an
  # untitled commit (0000319 req-002). It reads the branch head, not the PR
  # merge ref, so the merge commit is not counted.
  initiative-history:
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && startsWith(github.head_ref, 'initiative/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check first-parent titles
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: node ravintio-zero/scripts/check-initiative-history.mjs --base origin/main --head "origin/$HEAD_REF"

  # Fails a PR into main from outside an initiative whose branch name or
  # commit count breaks the rule (0000327 req-002). It reads the branch head,
  # not the PR merge ref, so the merge commit is not counted.
  squash-before-main:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the branch and commit count
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: node ravintio-zero/scripts/check-pr-into-main.mjs --head-ref "$HEAD_REF" --base origin/main --head "origin/$HEAD_REF"

  # Fails a push to main whose newest commit squashed an initiative PR
  # (0000319 req-004).
  main-merge-check:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check the merge method
        run: node ravintio-zero/scripts/check-main-merge.mjs

  # Tags the merge commit on the default branch after the human merges
  # (0000169 ADR-002). Only this job holds write access, and it never runs
  # PR code.
  release-tag:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Pinned to the v4 commit, because this job holds a write token
      # (0000169 S-001). Credentials persist on purpose, so git push works
      # (0000169 S-003).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Tag the merge commit
        run: node ravintio-zero/scripts/release-tag.mjs
