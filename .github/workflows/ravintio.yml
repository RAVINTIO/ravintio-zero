name: RAVINTIO Strict Pipeline

on:
  pull_request:
    types: [ opened, synchronize, reopened, closed ]
    branches: [ main, master, 'initiative/**' ]
  push:
    branches: [ main, master, 'initiative/**' ]

# Every job reads the repo and nothing more, except release-tag and
# cleanup-branch (0000036 S-006, 0000355 ADR-003).
permissions:
  contents: read

jobs:
  validate-branch:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      # Pinned to the v4 commit, with no token left in .git/config (0000394).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Code/Doc Parity
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          CHANGED_FILES=$(git diff --name-only "origin/$BASE_REF"...HEAD)
          # Standard check. This is a presence check, not a correspondence
          # guarantee: it confirms a file under plan/, docs/, or a
          # component.yml also changed in this diff — it does not verify
          # that file's content actually corresponds to the src/ change.
          if echo "$CHANGED_FILES" | grep -q "^src/"; then
            if ! echo "$CHANGED_FILES" | grep -qE "^(plan/|docs/|.*component\.yml)"; then
              echo "::error title=RAVINTIO Strict Violation::Code under src/ changed with no plan/, docs/, or component.yml file also touched in this diff. This checks presence only — it does not verify that content corresponds to your change."
              exit 1
            fi
          fi
          echo "✅ RAVINTIO pipeline passed."

      - name: Check PR description for attribution
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"
          node ravintio-zero/scripts/check-attribution.mjs "$RUNNER_TEMP/pr-body.txt"

      - name: Check the backlog index
        run: node ravintio-zero/scripts/backlog-index.mjs --check

      - name: Check the pack facts file
        run: node ravintio-zero/scripts/pack-facts.mjs --check

      - name: Fail on a committed ignored file
        run: |
          IGNORED=$(git ls-files -ci --exclude-standard)
          if [ -n "$IGNORED" ]; then
            echo "::error title=RAVINTIO Strict Violation::A committed file matches an ignore rule. Remove it from the index, or add a negation rule to .gitignore if it must be tracked."
            echo "$IGNORED"
            exit 1
          fi

  # This job is specific to this repository's own self-description and is
  # deliberately NOT mirrored into ravintio-zero/hooks/ravintio.yml
  # (the copy setup.sh ships to consumer repos) — a consuming repo's README
  # doesn't have this repository's "## Repository structure" / "## The
  # pack" sections to validate against. See ADR-001 (feature 0000019).
  self-description-check:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify README matches repository structure
        run: node ravintio-zero/scripts/self-description-check.mjs .

  # Lints the workflows with actionlint and zizmor, each at a pinned version
  # (0000394 ADR-002). Like self-description-check, it is deliberately NOT
  # mirrored into ravintio-zero/hooks/ravintio.yml, because a consuming repo
  # picks its own lint tools. zizmor runs without online audits, so it needs
  # no token.
  workflow-lint:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12

      - name: Install zizmor
        run: pipx install zizmor==1.32.0

      - name: Run actionlint
        run: ./actionlint -color .github/workflows/*.yml

      - name: Run zizmor
        run: zizmor --no-online-audits .github/workflows

  # The PowerShell suites under Windows PowerShell 5.1, in 3 parallel shards
  # (0000409 ADR-0284, which supersedes 0000036 ADR-003). pwsh runs the same
  # suites on Linux in bash-suites-shard. fail-fast stays off so one failing
  # shard does not cancel the others.
  windows-powershell-shard:
    name: windows-powershell shard ${{ matrix.shard }}
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        shell: powershell
    steps:
      # Pinned to the v4 commit, with no token left in .git/config while the
      # PR's code runs (0000036 S-005).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: PowerShell suites, one shard of 3
        env:
          RAVINTIO_SHARD: ${{ matrix.shard }}/3
        run: |
          & ./ravintio-zero/tests/run-tests.ps1
          exit $LASTEXITCODE

  # Carries the required check name "windows-powershell (powershell)". It runs
  # even when a shard fails, and passes only when every shard passed. Its "if"
  # adds always() to the pull request guard, so it carries the marker.
  # ravintio:job-guard-exempt
  windows-powershell:
    name: windows-powershell (powershell)
    if: always() && github.event_name == 'pull_request' && github.event.action != 'closed'
    needs: windows-powershell-shard
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.windows-powershell-shard.result }}
        run: test "$RESULT" = success

  # The Bash suites on Linux in 4 parallel shards (0000037 ADR-002, 0000409
  # ADR-0284). run-tests.sh also runs the .ps1 suites with pwsh, which
  # ubuntu-latest ships. RAVINTIO_REQUIRE_PWSH fails the run if pwsh is
  # missing, so no suite skips unseen.
  bash-suites-shard:
    name: bash-suites shard ${{ matrix.shard }}
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      # Pinned to the v4 commit, with no token left in .git/config while the
      # PR's code runs (0000036 S-005).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Bash suites on Linux, one shard of 4
        env:
          RAVINTIO_REQUIRE_PWSH: "1"
          RAVINTIO_SHARD: ${{ matrix.shard }}/4
        run: bash ravintio-zero/tests/run-tests.sh

  # Carries the required check name "bash-suites". It runs even when a shard
  # fails, and passes only when every shard passed. Its "if" adds always() to
  # the pull request guard, so it carries the marker.
  # ravintio:job-guard-exempt
  bash-suites:
    if: always() && github.event_name == 'pull_request' && github.event.action != 'closed'
    needs: bash-suites-shard
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Every shard passed
        env:
          RESULT: ${{ needs.bash-suites-shard.result }}
        run: test "$RESULT" = success

  # Fails a PR from initiative/* to main whose first-parent history holds an
  # untitled commit (0000319 req-002). It reads the branch head, not the PR
  # merge ref, so the merge commit is not counted.
  # ravintio:job-guard-exempt
  initiative-history:
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.base_ref == 'main' && startsWith(github.head_ref, 'initiative/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check first-parent titles
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: node ravintio-zero/scripts/check-initiative-history.mjs --base origin/main --head "origin/$HEAD_REF"

  # Fails a PR into main from outside an initiative whose branch name or
  # commit count breaks the rule (0000327 req-002). It reads the branch head,
  # not the PR merge ref, so the merge commit is not counted.
  # ravintio:job-guard-exempt
  squash-before-main:
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the branch and commit count
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: node ravintio-zero/scripts/check-pr-into-main.mjs --head-ref "$HEAD_REF" --base origin/main --head "origin/$HEAD_REF"

  # Fails a push to main whose newest commit squashed an initiative PR
  # (0000319 req-004).
  # ravintio:job-guard-exempt
  main-merge-check:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check the merge method
        run: node ravintio-zero/scripts/check-main-merge.mjs

  # Tags the merge commit on the default branch after the human merges
  # (0000169 ADR-002). Only this job holds write access, and it never runs
  # PR code.
  # ravintio:job-guard-exempt
  release-tag:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Pinned to the v4 commit, because this job holds a write token
      # (0000169 S-001). Credentials persist on purpose, so git push works
      # (0000169 S-003).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0

      - name: Set git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Tag the merge commit
        run: node ravintio-zero/scripts/release-tag.mjs

  # Deletes the head branch of a merged PR (0000355 ADR-003). It holds the
  # only pull request write scope, runs no PR code, and has no checkout. It
  # skips a fork head, refuses main and master, and reads the ref from env.
  # ravintio:job-guard-exempt
  cleanup-branch:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete the head branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          case "$HEAD_REF" in
            main|master) echo "Refusing to delete a protected branch."; exit 0 ;;
            *..*|*[!A-Za-z0-9._/-]*) echo "Head branch name fails the allowed pattern. Nothing deleted."; exit 0 ;;
          esac
          if [ "${#HEAD_REF}" -gt 200 ]; then
            echo "Head branch name is over 200 characters. Nothing deleted."
            exit 0
          fi
          if ! gh api "repos/$REPO/git/ref/heads/$HEAD_REF" >/dev/null 2>&1; then
            echo "Branch $HEAD_REF is already gone."
            exit 0
          fi
          gh api -X DELETE "repos/$REPO/git/refs/heads/$HEAD_REF"
          echo "Deleted branch $HEAD_REF."
