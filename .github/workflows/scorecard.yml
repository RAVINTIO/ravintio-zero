name: Scorecard

# Scores the repo against the OpenSSF Scorecard checks and uploads the result
# to code scanning (0000394 REQ-002). It runs on a schedule and on pushes to
# main, and never runs pull request code.
on:
  schedule:
    - cron: '17 4 * * 1'
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  # ravintio:job-guard-exempt
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload the result to code scanning
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          sarif_file: results.sarif
